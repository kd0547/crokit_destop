<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 A · 사이드바 트리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="base.css" />
<style>
  /* 요약 카드 (접힌 상태) */
  .fa-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .fa-head .section-label { flex: 1; }
  .fa-summary {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-align: left;
    border-radius: var(--radius-md); background: var(--color-surface-2); border: 1px solid var(--color-border-2);
  }
  .fa-summary.open { border-color: var(--color-accent-600); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .fa-summary .stack { flex: 1; min-width: 0; }
  .fa-summary .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fa-summary .sub { display: block; font-size: 11px; color: var(--color-neutral-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fa-summary .title { display: block; }

  /* 트리 패널 */
  .fa-panel {
    border: 1px solid var(--color-accent-600); border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md);
    background: var(--color-surface); display: flex; flex-direction: column;
  }
  .fa-search { display: flex; align-items: center; gap: 8px; margin: 8px 8px 4px; padding: 0 10px; height: 32px; border-radius: 6px; background: var(--color-surface-2); border: 1px solid var(--color-border-2); }
  .fa-search i { color: var(--color-neutral-600); }
  .fa-search input { flex: 1; min-width: 0; height: 100%; background: transparent; border: none; outline: none; font-size: 12.5px; }
  .fa-tree { overflow-y: auto; padding: 4px; height: var(--tree-h, 380px); }

  .row {
    position: relative; display: flex; align-items: center; gap: 6px; height: 32px; padding-right: 8px; border-radius: 6px; cursor: pointer;
  }
  .row:hover { background: var(--color-hover); }
  .row.root { height: 46px; margin-top: 4px; }
  .row.root:first-child { margin-top: 0; }
  .guide { flex: none; width: 18px; align-self: stretch; position: relative; }
  .guide::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--color-border-strong); }
  .row:hover .guide.near::before { background: var(--color-accent-700); }
  .chev { flex: none; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; color: var(--color-neutral-600); border-radius: 4px; transition: transform .12s; }
  .chev:hover { background: var(--color-border-3); color: var(--color-text); }
  .chev.open { transform: rotate(90deg); }
  .chev.none { visibility: hidden; }
  .ficon { flex: none; font-size: 16px; color: var(--color-neutral-500); }
  .row.on .ficon { color: var(--color-accent); }
  .root-badge {
    flex: none; width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.root .name { font-weight: 500; font-size: 13.5px; }
  .row.root .path { display: block; font-size: 10.5px; color: var(--color-neutral-700); font-weight: 400; }
  .row .count { flex: none; min-width: 26px; text-align: right; }
  .row.on .count { color: var(--color-accent-400); }
  .row .count .direct { color: var(--color-neutral-700); }
  .solo {
    display: none; flex: none; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 10.5px;
    background: var(--color-border-3); color: var(--color-neutral-300);
  }
  .solo:hover { background: var(--color-accent-800); color: var(--color-accent-100); }
  .row:hover .solo { display: inline-flex; align-items: center; }
  .row:hover .count { display: none; }
  .more { display: none; flex: none; width: 22px; height: 22px; border-radius: 5px; align-items: center; justify-content: center; color: var(--color-neutral-500); }
  .row.root:hover .more { display: inline-flex; }
  .more:hover { background: var(--color-border-3); color: var(--color-text); }

  .fa-foot { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--color-divider); font-size: 12px; color: var(--color-neutral-400); }
  .fa-foot b { color: var(--color-accent-300); font-weight: 600; }
  .fa-resize { height: 10px; cursor: ns-resize; display: flex; align-items: center; justify-content: center; }
  .fa-resize::before { content: ""; width: 32px; height: 3px; border-radius: 2px; background: var(--color-border-strong); }
  .fa-resize:hover::before { background: var(--color-accent-700); }
  .fa-drop {
    margin: 8px 0 0; padding: 10px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11.5px; color: var(--color-neutral-600);
  }
  .fa-drop.hot { border-color: var(--color-accent); color: var(--color-accent-300); background: color-mix(in srgb, var(--color-accent) 8%, transparent); }

  .legend { position: absolute; top: 18px; right: 18px; width: 270px; padding: 14px 16px; border-radius: var(--radius-lg); background: rgba(13,14,21,.92); border: 1px solid var(--color-border-3); font-size: 12px; color: var(--color-neutral-400); line-height: 1.6; }
  .legend h3 { margin: 0 0 6px; font-size: 13px; color: var(--color-text); font-weight: 600; }
  .legend ul { margin: 0; padding-left: 16px; }
  .legend kbd { font: 500 10.5px var(--font-body); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--color-border-strong); color: var(--color-neutral-300); }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell({ draft: "A", sidebarWidth: 340 });

  const open = new Set(["f0", "f1", "f6"]); // 레퍼런스, 포즈, 여성
  let panelOpen = true;
  let query = "";
  // 초기 선택: 여성 전체 + 손(직접 이미지만)
  setSubtree(NODES.f6, true);
  sel.add(NODES.f11.id);

  const slot = document.getElementById("folder-slot");
  slot.innerHTML = `
    <div class="fa-head">
      <div class="section-label">사진 폴더</div>
      <button class="btn btn-ghost btn-icon" title="폴더 등록" style="width:24px;height:24px"><i class="ph ph-plus" style="font-size:14px"></i></button>
    </div>
    <button class="fa-summary" id="summary"></button>
    <div class="fa-panel" id="panel">
      <label class="fa-search"><i class="ph ph-magnifying-glass"></i><input id="q" placeholder="폴더 이름 검색" /></label>
      <div class="fa-tree" id="tree" role="tree"></div>
      <div class="fa-foot" id="foot"></div>
      <div class="fa-resize" id="resize" title="드래그해서 높이 조절"></div>
    </div>
    <div class="fa-drop" id="drop"><i class="ph ph-folder-simple-plus" style="font-size:15px"></i>폴더를 여기로 끌어다 놓아 등록</div>`;

  function visible(node) {
    if (!query) return true;
    return subtree(node).some((x) => x.name.toLowerCase().includes(query.toLowerCase()));
  }
  function isOpen(node) { return query ? visible(node) : open.has(node.id); }

  function rowHtml(node) {
    const st = selState(node);
    const on = st !== "none";
    const hasKids = node.children.length > 0;
    const chev = `<span class="chev ${hasKids ? (isOpen(node) ? "open" : "") : "none"}" data-chev="${node.id}"><i class="ph ph-caret-right"></i></span>`;
    const countHtml = node.children.length && node.n
      ? `${node.total}<span class="direct"> · ${node.n}</span>`
      : node.total;
    if (node.depth === 0) {
      return `<div class="row root ${on ? "on" : ""}" data-row="${node.id}" role="treeitem">
        ${chev}${cboxHtml(node)}
        <span class="root-badge" style="background:hsl(${node.hue} 30% 16%);color:hsl(${node.hue} 60% 75%)"><i class="ph-fill ph-folder-simple"></i></span>
        <span class="name">${highlight(node.name, query)}<span class="path">${esc(node.path)}</span></span>
        <span class="count">${countHtml}</span>
        <button class="solo" data-solo="${node.id}">이것만</button>
        <button class="more" title="탐색기에서 열기 · 목록에서 제거"><i class="ph ph-dots-three"></i></button>
      </div>`;
    }
    const guides = Array.from({ length: node.depth }, (_, i) => `<span class="guide ${i === node.depth - 1 ? "near" : ""}"></span>`).join("");
    const icon = hasKids && isOpen(node) ? "ph-folder-open" : "ph-folder-simple";
    return `<div class="row ${on ? "on" : ""}" data-row="${node.id}" role="treeitem">
      ${guides}${chev}${cboxHtml(node)}
      <i class="ph ${icon} ficon"></i>
      <span class="name">${highlight(node.name, query)}</span>
      ${node.gif ? '<span class="gif-tag">GIF</span>' : ""}
      <span class="count">${countHtml}</span>
      <button class="solo" data-solo="${node.id}">이것만</button>
    </div>`;
  }

  function renderTree() {
    const out = [];
    (function walk(list) {
      list.forEach((n) => {
        if (!visible(n)) return;
        out.push(rowHtml(n));
        if (n.children.length && isOpen(n)) walk(n.children);
      });
    })(TREE);
    document.getElementById("tree").innerHTML = out.join("") || `<div class="empty-note">'${esc(query)}'와 일치하는 폴더가 없습니다</div>`;
  }

  function renderSummary() {
    const s = selSummary();
    const total = selTotal();
    const title = s.length === 0 ? "선택된 폴더 없음"
      : s.length === 1 ? fullPath(s[0].node)
      : `${s[0].node.name} 외 ${s.length - 1}개 폴더`;
    document.getElementById("summary").className = "fa-summary" + (panelOpen ? " open" : "");
    document.getElementById("summary").innerHTML = `
      <i class="ph-fill ph-folders" style="font-size:20px;color:var(--color-accent)"></i>
      <span class="stack"><span class="title">${esc(title)}</span>
      <span class="sub">${total}장 · ${s.map((x) => x.node.name + (x.onlyDirect ? "(이 폴더만)" : "")).join(", ") || "아래 목록에서 체크하세요"}</span></span>
      <i class="ph ${panelOpen ? "ph-caret-up" : "ph-caret-down"}" style="color:var(--color-neutral-600)"></i>`;
    document.getElementById("panel").style.display = panelOpen ? "flex" : "none";
    document.getElementById("foot").innerHTML = `
      <span><b>${s.length}</b>개 폴더 · <b>${total}</b>장 선택</span>
      <span style="flex:1"></span>
      <button class="btn btn-quiet" style="height:24px;padding:0 8px;font-size:11.5px" data-clear>모두 해제</button>`;
  }

  function render() { renderTree(); renderSummary(); }
  window.addEventListener("selchange", render);
  emitSel();

  // ---------- 상호작용 ----------
  slot.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("#summary")) { panelOpen = !panelOpen; return render(); }
    if (t.closest("[data-clear]")) return clearSel();
    const solo = t.closest("[data-solo]");
    if (solo) { e.stopPropagation(); return soloSel(NODES[solo.dataset.solo]); }
    if (t.closest(".more")) return;
    const check = t.closest("[data-check]");
    if (check) return toggleSel(NODES[check.dataset.check]);
    const chev = t.closest("[data-chev]");
    const row = t.closest("[data-row]");
    if (!chev && !row) return;
    const node = NODES[(chev || row).dataset.chev || row.dataset.row];
    // 하위가 있으면 펼치기/접기, 말단 폴더면 체크
    if (node.children.length && (chev || !query)) {
      open.has(node.id) ? open.delete(node.id) : open.add(node.id);
      render();
    } else toggleSel(node);
  });
  slot.addEventListener("dblclick", (e) => {
    const row = e.target.closest("[data-row]");
    if (row && !e.target.closest("[data-check]")) soloSel(NODES[row.dataset.row]);
  });
  document.getElementById("q").addEventListener("input", (e) => { query = e.target.value.trim(); renderTree(); });

  // 트리 높이 드래그 조절
  const resize = document.getElementById("resize");
  resize.addEventListener("pointerdown", (e) => {
    const tree = document.getElementById("tree");
    const startY = e.clientY, startH = tree.offsetHeight;
    resize.setPointerCapture(e.pointerId);
    const move = (ev) => tree.style.setProperty("--tree-h", Math.max(160, Math.min(720, startH + ev.clientY - startY)) + "px");
    resize.addEventListener("pointermove", move);
    resize.addEventListener("pointerup", () => resize.removeEventListener("pointermove", move), { once: true });
  });

  // 드롭존 시연 (실제 등록은 하지 않음)
  const drop = document.getElementById("drop");
  ["dragenter", "dragover"].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("hot"); }));
  ["dragleave", "drop"].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === "drop" || !e.relatedTarget) drop.classList.remove("hot"); }));

  document.getElementById("stage").insertAdjacentHTML("beforeend", `
    <div class="legend">
      <h3>시안 A — 사이드바 인라인 트리</h3>
      <ul>
        <li>지금 드롭다운 자리를 <b>펼쳐지는 트리</b>로 교체</li>
        <li>행 높이 32px(루트 46px), 단계마다 세로 가이드선</li>
        <li>체크 = 하위 폴더까지 포함, 일부만 체크되면 <b>–</b> 표시</li>
        <li>숫자 <b>151 · 6</b> = 하위 포함 · 이 폴더에만 있는 장수</li>
        <li>행에 마우스를 올리면 <b>이것만</b> 버튼(더블클릭도 같음)</li>
        <li>아래 손잡이로 트리 높이 조절, 검색하면 자동으로 펼침</li>
      </ul>
    </div>`);
</script>
</body>
</html>
