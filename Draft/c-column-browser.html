<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시안 C · 컬럼 브라우저</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="base.css" />
<style>
  /* ---- 사이드바: 선택 목록 ---- */
  .fc-pick {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; text-align: left; border-radius: var(--radius-md);
    background: var(--color-surface-2); border: 1px solid var(--color-border-2);
  }
  .fc-pick:hover { border-color: var(--color-border-strong); }
  .fc-pick.on { border-color: var(--color-accent-600); }
  .fc-pick kbd { font: 500 10.5px var(--font-body); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--color-border-strong); color: var(--color-neutral-500); }
  .fc-list { display: flex; flex-direction: column; margin-top: 6px; }
  .fc-item { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 4px 0 8px; border-radius: 6px; }
  .fc-item:hover { background: var(--color-hover); }
  .fc-item .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .fc-item .nm span { color: var(--color-neutral-600); }
  .fc-item .rm { width: 22px; height: 22px; border-radius: 5px; display: none; align-items: center; justify-content: center; color: var(--color-neutral-500); }
  .fc-item:hover .rm { display: inline-flex; }
  .fc-item:hover .count { display: none; }
  .fc-item .rm:hover { background: var(--color-border-3); color: var(--color-text); }
  .side-note { font-size: 11.5px; line-height: 1.6; color: var(--color-neutral-500); padding: 12px; border-radius: var(--radius-md); border: 1px dashed var(--color-border-strong); }
  .side-note b { color: var(--color-neutral-300); font-weight: 500; }

  /* ---- 브라우저 오버레이 ---- */
  .scrim { position: absolute; inset: 0; z-index: 8; background: rgba(7,8,12,.72); backdrop-filter: blur(2px); display: flex; padding: 16px; }
  .panel { flex: 1; min-width: 0; display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--color-surface); border: 1px solid var(--color-border-3); box-shadow: 0 24px 70px rgba(0,0,0,.7); overflow: hidden; }
  .p-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--color-border); }
  .p-head h3 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .p-head .btn { white-space: nowrap; flex: none; }
  .p-search { flex: 0 1 300px; min-width: 120px; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--color-surface-2); border: 1px solid var(--color-border-2); margin-left: auto; }
  .p-search input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; font-size: 12.5px; }

  .p-body { flex: 1; min-height: 0; display: flex; container-type: inline-size; }
  .cols { flex: 1; min-width: 0; display: flex; overflow-x: auto; }
  .col { flex: none; width: 200px; overflow-y: auto; padding: 6px; border-right: 1px solid var(--color-border); }
  .col-title { padding: 6px 8px 4px; font-size: 10.5px; letter-spacing: .06em; color: var(--color-neutral-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; border-radius: 7px; cursor: pointer; }
  .crow:hover { background: var(--color-hover); }
  .crow.path { background: var(--color-border-3); }
  .crow.focus { background: var(--color-accent-900); box-shadow: inset 0 0 0 1px var(--color-accent-700); }
  .crow .ic { flex: none; font-size: 16px; color: var(--color-neutral-500); }
  .crow.path .ic, .crow.focus .ic { color: var(--color-accent); }
  .crow .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow.root { height: 46px; }
  .crow.root .nm { font-weight: 500; }
  .crow.root .nm small { display: block; font-size: 10.5px; font-weight: 400; color: var(--color-neutral-700); }
  .crow .go { flex: none; color: var(--color-neutral-700); font-size: 12px; }
  .crow.direct { color: var(--color-neutral-400); font-size: 12px; border: 1px dashed var(--color-border-strong); margin-bottom: 4px; }
  .crow.direct .ic { color: var(--color-neutral-600); }

  .pv { flex: none; width: 300px; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-left: 1px solid var(--color-border); overflow-y: auto; background: var(--color-bg); }
  .pv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .pv-grid span { aspect-ratio: 3/4; border-radius: 4px; }
  .pv h4 { margin: 0; font-size: 17px; font-weight: 600; }
  .pv .path { font-size: 11px; color: var(--color-neutral-600); word-break: break-all; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stats div { padding: 8px; border-radius: 8px; background: var(--color-surface-2); border: 1px solid var(--color-border-2); font-size: 10.5px; color: var(--color-neutral-600); }
  .stats b { display: block; font-size: 16px; font-weight: 600; color: var(--color-text); font-variant-numeric: tabular-nums; }
  .pv .actions { display: flex; flex-direction: column; gap: 6px; }
  .pv .actions .btn { justify-content: flex-start; height: 36px; }
  .keys { margin-top: auto; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 11px; color: var(--color-neutral-600); }
  .keys kbd { font: 500 10.5px var(--font-body); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--color-border-strong); color: var(--color-neutral-300); text-align: center; }

  /* 창이 좁으면 미리보기를 줄여 컬럼 자리를 확보 */
  @container (max-width: 820px) {
    .pv { width: 230px; padding: 12px; gap: 10px; }
    .pv-grid span:nth-child(n+7) { display: none; }
    .keys { display: none; }
    .col { width: 180px; }
  }
  .results { flex: 1; overflow-y: auto; padding: 8px; }
  .results .crow .crumb { font-size: 11px; color: var(--color-neutral-600); }

  .p-foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-top: 1px solid var(--color-border); background: var(--color-surface); }
  .p-foot .total { flex: none; font-size: 12px; color: var(--color-neutral-400); }
  .p-foot .total b { color: var(--color-text); font-size: 14px; }
  .p-foot .chips-row { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .p-foot .chips-row::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
  renderShell({ draft: "C" });

  let focus = NODES.f6; // 레퍼런스 › 포즈 › 여성
  let query = "";
  let browserOpen = true;
  setSubtree(NODES.f6, true);
  sel.add(NODES.f11.id);                                  // 손 (이 폴더만)
  setSubtree(TREE[1].children[2], true);                  // 크로키 모음 2024 › 3월

  const slot = document.getElementById("folder-slot");
  const stage = document.getElementById("stage");
  stage.insertAdjacentHTML("beforeend", `<div class="scrim" id="scrim"></div>`);
  const scrim = document.getElementById("scrim");

  function chipHtml(node, onlyDirect) {
    const parent = node.parent ? `<span class="crumb">${esc(node.parent.name)} ›</span>` : "";
    return `<span class="sel-chip" title="${esc(fullPath(node))}">${parent}${esc(node.name)}${onlyDirect ? " (이 폴더만)" : ""}<button class="x" data-unsel="${node.id}" data-only="${onlyDirect ? 1 : ""}"><i class="ph ph-x"></i></button></span>`;
  }

  // ---------- 사이드바 ----------
  function renderSide() {
    const s = selSummary();
    slot.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="section-label">사진 폴더</div>
        <button class="fc-pick ${browserOpen ? "on" : ""}" data-toggle>
          <i class="ph-fill ph-folders" style="font-size:20px;color:var(--color-accent)"></i>
          <span style="flex:1;min-width:0"><span style="display:block;font-weight:500">${s.length}개 폴더 · ${selTotal()}장</span>
          <span style="display:block;font-size:11px;color:var(--color-neutral-600)">폴더 선택 열기</span></span>
          <kbd>F</kbd>
        </button>
        <div class="fc-list">
          ${s.map(({ node, onlyDirect }) => `<div class="fc-item">
            <i class="ph ph-folder-simple" style="color:var(--color-accent)"></i>
            <span class="nm" title="${esc(fullPath(node))}">${node.parent ? `<span>${esc(fullPath(node.parent))} › </span>` : ""}${esc(node.name)}${onlyDirect ? "<span> (이 폴더만)</span>" : ""}</span>
            <span class="count">${onlyDirect ? node.n : node.total}</span>
            <button class="rm" data-unsel="${node.id}" data-only="${onlyDirect ? 1 : ""}" title="선택 해제"><i class="ph ph-x"></i></button>
          </div>`).join("")}
        </div>
      </div>
      <div class="side-note">
        <b>시안 C — 컬럼 브라우저</b><br>
        macOS Finder의 컬럼 보기 방식이에요. 깊은 폴더도 <b>한 화면에 경로 전체</b>가 보이고, 오른쪽에서 고른 폴더를 미리 볼 수 있어요.
        방향키와 Space만으로 키보드 조작이 가능합니다.
      </div>`;
  }

  // ---------- 브라우저 ----------
  function rowHtml(node, cls = "") {
    const st = selState(node);
    const inPath = ancestors(focus).includes(node);
    const isFocus = node === focus;
    const icon = node.children.length ? (inPath ? "ph-folder-open" : "ph-folder-simple") : node.gif ? "ph-film-strip" : "ph-folder-simple";
    return `<div class="crow ${node.depth === 0 ? "root" : ""} ${isFocus ? "focus" : inPath ? "path" : ""} ${cls}" data-focus="${node.id}">
      ${cboxHtml(node)}
      <i class="ph ${icon} ic"></i>
      <span class="nm">${esc(node.name)}${node.depth === 0 ? `<small>${esc(node.path)}</small>` : ""}</span>
      <span class="count" style="${st !== "none" ? "color:var(--color-accent-400)" : ""}">${node.total}</span>
      <i class="ph ph-caret-right go" style="${node.children.length ? "" : "visibility:hidden"}"></i>
    </div>`;
  }

  function columnsHtml() {
    const trail = ancestors(focus);
    const cols = [{ title: "등록된 폴더", items: TREE, owner: null }];
    trail.forEach((n) => { if (n.children.length) cols.push({ title: n.name, items: n.children, owner: n }); });
    return cols.map(({ title, items, owner }) => `<div class="col">
      <div class="col-title">${esc(title)}</div>
      ${owner && owner.n ? `<div class="crow direct" data-only-toggle="${owner.id}">
          <span class="cbox ${sel.has(owner.id) ? "all" : "none"}">${sel.has(owner.id) ? '<i class="ph-bold ph-check"></i>' : ""}</span>
          <i class="ph ph-images ic"></i><span class="nm">이 폴더의 이미지</span><span class="count">${owner.n}</span></div>` : ""}
      ${items.map((n) => rowHtml(n)).join("")}
    </div>`).join("");
  }

  function previewHtml() {
    const n = focus;
    const st = selState(n);
    const pv = previewsOf(n, 9);
    return `<div class="pv-grid">${pv.map(([x, i]) => `<span style="background:${thumbBg(x, i)}"></span>`).join("")}</div>
      <div><h4>${esc(n.name)}</h4><div class="path">${esc(rootOf(n).path)}${n.depth ? "\\" + ancestors(n).slice(1).map((a) => a.name).join("\\") : ""}</div></div>
      <div class="stats"><div><b>${n.n}</b>이 폴더</div><div><b>${n.total}</b>하위 포함</div><div><b>${subtree(n).length - 1}</b>하위 폴더</div></div>
      <div class="actions">
        <button class="btn ${st === "all" ? "btn-ghost" : "btn-primary"}" data-check="${n.id}"><i class="ph ${st === "all" ? "ph-check-square" : "ph-plus-square"}"></i>${st === "all" ? "선택됨 · 해제" : n.children.length ? `하위 포함 선택 (${n.total}장)` : `선택 (${n.total}장)`}</button>
        ${n.children.length && n.n ? `<button class="btn btn-quiet" data-only-toggle="${n.id}"><i class="ph ph-image"></i>이 폴더 이미지만 ${sel.has(n.id) ? "해제" : `선택 (${n.n}장)`}</button>` : ""}
        <button class="btn btn-quiet" data-solo="${n.id}"><i class="ph ph-crosshair"></i>이것만 선택 (나머지 해제)</button>
      </div>
      <div class="keys">
        <kbd>↑ ↓</kbd><span>같은 단계에서 이동</span>
        <kbd>→ ←</kbd><span>하위로 들어가기 / 상위로</span>
        <kbd>Space</kbd><span>선택 · 해제</span>
        <kbd>Enter</kbd><span>선택 완료</span>
        <kbd>/</kbd><span>검색</span>
      </div>`;
  }

  function resultsHtml() {
    const hits = allNodes().filter((n) => n.name.toLowerCase().includes(query.toLowerCase()));
    if (!hits.length) return `<div class="results"><div class="empty-note">'${esc(query)}'와 일치하는 폴더가 없습니다</div></div>`;
    return `<div class="results">${hits.map((n) => `<div class="crow" data-reveal="${n.id}">
      ${cboxHtml(n)}<i class="ph ph-folder-simple ic"></i>
      <span class="nm">${highlight(n.name, query)} <span class="crumb">${n.parent ? esc(fullPath(n.parent)) : esc(n.path)}</span></span>
      <span class="count">${n.total}</span><i class="ph ph-arrow-bend-down-right go"></i></div>`).join("")}</div>`;
  }

  function renderBrowser() {
    scrim.style.display = browserOpen ? "flex" : "none";
    if (!browserOpen) return;
    const s = selSummary();
    const hadFocus = document.activeElement && document.activeElement.id === "q";
    scrim.innerHTML = `<div class="panel">
      <div class="p-head">
        <i class="ph-fill ph-folders" style="font-size:18px;color:var(--color-accent)"></i>
        <h3>폴더 선택</h3>
        <label class="p-search"><i class="ph ph-magnifying-glass" style="color:var(--color-neutral-600)"></i><input id="q" placeholder="폴더 검색  ( / )" value="${esc(query)}" /></label>
        <button class="btn btn-ghost" style="height:30px"><i class="ph ph-folder-simple-plus"></i>폴더 등록</button>
        <button class="btn btn-quiet btn-icon" data-toggle title="닫기 (Esc)"><i class="ph ph-x"></i></button>
      </div>
      <div class="p-body">
        ${query ? resultsHtml() : `<div class="cols" id="cols">${columnsHtml()}</div>`}
        <aside class="pv">${previewHtml()}</aside>
      </div>
      <div class="p-foot">
        <span class="total"><b>${selTotal()}장</b> · ${s.length}개 폴더</span>
        <div class="chips-row">${s.map(({ node, onlyDirect }) => chipHtml(node, onlyDirect)).join("")}</div>
        <button class="btn btn-quiet" data-clear style="flex:none">모두 해제</button>
        <button class="btn btn-fill" data-toggle style="flex:none;height:34px;padding:0 18px">완료</button>
      </div>
    </div>`;
    const cols = document.getElementById("cols");
    if (cols) cols.scrollLeft = cols.scrollWidth;
    if (hadFocus) { const q = document.getElementById("q"); q.focus(); q.setSelectionRange(query.length, query.length); }
  }

  function render() { renderSide(); renderBrowser(); }
  window.addEventListener("selchange", render);
  emitSel();

  // ---------- 상호작용 ----------
  document.addEventListener("click", (e) => {
    const t = e.target;
    const un = t.closest("[data-unsel]");
    if (un) { const n = NODES[un.dataset.unsel]; un.dataset.only ? sel.delete(n.id) : setSubtree(n, false); return emitSel(); }
    if (t.closest("[data-toggle]")) { browserOpen = !browserOpen; return render(); }
    if (t === scrim) { browserOpen = false; return render(); }
    if (t.closest("[data-clear]")) return clearSel();
    const only = t.closest("[data-only-toggle]");
    if (only) { const n = NODES[only.dataset.onlyToggle]; sel.has(n.id) ? sel.delete(n.id) : sel.add(n.id); return emitSel(); }
    const solo = t.closest("[data-solo]");
    if (solo) return soloSel(NODES[solo.dataset.solo]);
    const check = t.closest("[data-check]");
    if (check) return toggleSel(NODES[check.dataset.check]);
    const reveal = t.closest("[data-reveal]");
    if (reveal) { focus = NODES[reveal.dataset.reveal]; query = ""; return renderBrowser(); }
    const f = t.closest("[data-focus]");
    if (f) { focus = NODES[f.dataset.focus]; return renderBrowser(); }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { query = e.target.value.trim(); renderBrowser(); } });

  document.addEventListener("keydown", (e) => {
    const typing = e.target.tagName === "INPUT";
    if (!browserOpen) {
      if (e.key === "f" || e.key === "F") { browserOpen = true; render(); }
      return;
    }
    if (e.key === "Escape") {
      if (query) { query = ""; renderBrowser(); } else { browserOpen = false; render(); }
      return;
    }
    if (typing) return;
    const siblings = focus.parent ? focus.parent.children : TREE;
    const i = siblings.indexOf(focus);
    if (e.key === "/") { e.preventDefault(); document.getElementById("q").focus(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); focus = siblings[Math.min(siblings.length - 1, i + 1)]; renderBrowser(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); focus = siblings[Math.max(0, i - 1)]; renderBrowser(); }
    else if (e.key === "ArrowRight" && focus.children.length) { e.preventDefault(); focus = focus.children[0]; renderBrowser(); }
    else if (e.key === "ArrowLeft" && focus.parent) { e.preventDefault(); focus = focus.parent; renderBrowser(); }
    else if (e.code === "Space") { e.preventDefault(); toggleSel(focus); }
    else if (e.key === "Enter") { browserOpen = false; render(); }
  });
</script>
</body>
</html>
